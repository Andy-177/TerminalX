<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TerminalX</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #0c0c0c; 
      color: #e0e0e0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* 标签栏 — 横向滚动 */
    .tab-bar {
      touch-action: none;
      display: flex;
      background: #1e1e1e;
      padding: 0 0.5rem;
      flex-shrink: 0;
      min-height: 44px;
      align-items: flex-end;
      gap: 3px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      flex-wrap: nowrap;
      scroll-behavior: smooth;
    }
    .tab-bar::-webkit-scrollbar {
      display: none;
    }

    /* 标签 — 初始宽度 256px */
    .tab {
      display: flex;
      align-items: center;
      padding: 7px 10px 7px 16px;
      background: #2a2a2a;
      color: #aaa;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s, color 0.15s;
      position: relative;
      white-space: nowrap;
      gap: 8px;
      width: 256px;
      min-width: 256px;
      flex-shrink: 0;
      flex-grow: 0;
      flex-basis: 256px;
      max-width: 360px;
    }
    .tab:hover {
      background: #333;
      color: #ddd;
    }
    .tab.active {
      background: #0c0c0c;
      color: #fff;
      flex-shrink: 0;
      flex-basis: 256px;
    }

    /* 空间不足时缩小 */
    .tab.shrinkable {
      flex-shrink: 1 !important;
      min-width: 80px;
      flex-basis: auto;
    }

    .tab .tab-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 20px;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .tab .close-btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 20px;
      height: 20px;
      background: transparent;
      color: #888;
      font-size: 16px;
      line-height: 16px;
      transition: background 0.2s, color 0.2s;
      cursor: pointer;
      border: none;
      padding: 0;
      flex-shrink: 0;
      margin-left: auto;
    }
    .tab .close-btn:hover {
      color: #fff;
    }

    .tab-add {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      margin-left: 4px;
      margin-bottom: 3px;
      color: #aaa;
      font-size: 26px;
      font-weight: 300;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      background: #1e1e1e;
      border: none;
      flex-shrink: 0;
      position: sticky;
      right: 0;
      z-index: 10;
    }
    .tab-add:hover {
      background: #3a3a3a;
      color: #fff;
    }

    /* 终端容器 */
    .terminal-wrapper {
      flex: 1;
      position: relative;
      background: #0c0c0c;
      overflow: hidden;
    }

    .terminal-pane {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
    }
    .terminal-pane.active {
      display: block;
    }

    .terminal-pane .xterm {
      padding: 8px;
      height: 100%;
    }

    .status-bar {
      background: #1a1a1a;
      color: #777;
      padding: 4px 16px;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
      min-height: 28px;
      align-items: center;
    }
    .status-bar span {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="tab-bar" id="tabBar">
    <button class="tab-add" id="addTabBtn" title="新建标签 (Ctrl+T)">+</button>
  </div>

  <div class="terminal-wrapper" id="terminalWrapper"></div>

  <div class="status-bar">
    <span id="tabCounter">标签: 1</span>
    <span id="clock"></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script>
    (function() {
      let tabs = [];
      let activeTabId = null;
      let nextId = 1;

      const tabBar = document.getElementById('tabBar');
      const wrapper = document.getElementById('terminalWrapper');
      const tabCounter = document.getElementById('tabCounter');

      const fitAddon = new FitAddon.FitAddon();

      function createDefaultTab() {
        return {
          id: nextId++,
          title: '终端',
          terminal: null,
          pane: null
        };
      }

      function createTerminal(tab) {
        const pane = document.createElement('div');
        pane.className = 'terminal-pane' + (tab.id === activeTabId ? ' active' : '');
        pane.dataset.tabId = tab.id;
        wrapper.appendChild(pane);

        const term = new Terminal({
          cursorBlink: true,
          fontSize: 15,
          fontFamily: '"Cascadia Code", "Fira Code", "JetBrains Mono", "SF Mono", "Menlo", "Consolas", monospace',
          theme: {
            background: '#0c0c0c',
            foreground: '#e0e0e0',
            cursor: '#ffffff',
            selectionBackground: '#264f78',
            black: '#0c0c0c',
            red: '#e06c75',
            green: '#98c379',
            yellow: '#d19a66',
            blue: '#61afef',
            magenta: '#c678dd',
            cyan: '#56b6c2',
            white: '#e0e0e0',
            brightBlack: '#5c6370',
            brightRed: '#e06c75',
            brightGreen: '#98c379',
            brightYellow: '#d19a66',
            brightBlue: '#61afef',
            brightMagenta: '#c678dd',
            brightCyan: '#56b6c2',
            brightWhite: '#ffffff'
          },
          allowProposedApi: true,
          scrollback: 10000
        });

        term.loadAddon(fitAddon);
        term.open(pane);

        tab.terminal = term;
        tab.pane = pane;

        term.writeln('\x1b[1;36m  TerminalX \x1b[0m');
        term.writeln('\x1b[90m  欢迎使用 TerminalX 终端\x1b[0m');
        term.writeln('');
        term.write('\x1b[32m❯\x1b[0m ');

        let lineBuffer = '';

        term.onData(function(data) {
          if (data === '\r') {
            term.writeln('');
            if (lineBuffer.trim()) {
              processCommand(term, lineBuffer.trim());
            }
            lineBuffer = '';
            term.write('\x1b[32m❯\x1b[0m ');
          } else if (data === '\x7f') {
            if (lineBuffer.length > 0) {
              lineBuffer = lineBuffer.slice(0, -1);
              term.write('\b \b');
            }
          } else if (data >= ' ') {
            lineBuffer += data;
            term.write(data);
          }
        });

        return tab;
      }

      function processCommand(term, cmd) {
        var args = cmd.split(/\s+/);
        var bin = args[0];

        switch(bin) {
          case 'help':
            term.writeln('\x1b[1;33m可用命令:\x1b[0m');
            term.writeln('  help     — 显示此帮助');
            term.writeln('  clear    — 清屏');
            term.writeln('  echo     — 输出文本');
            term.writeln('  date     — 显示日期时间');
            term.writeln('  whoami   — 显示用户');
            term.writeln('  uname    — 系统信息');
            term.writeln('  cat      — 模拟读取文件');
            term.writeln('  ls       — 模拟列目录');
            term.writeln('  neofetch — 系统信息展示');
            term.writeln('');
            break;
          case 'clear':
            term.clear();
            break;
          case 'echo':
            term.writeln(args.slice(1).join(' '));
            break;
          case 'date':
            term.writeln(new Date().toLocaleString('zh-CN'));
            break;
          case 'whoami':
            term.writeln('user@terminalx');
            break;
          case 'uname':
            if (args.includes('-a')) {
              term.writeln('TerminalX 1.0.0 browser xterm.js');
            } else {
              term.writeln('TerminalX');
            }
            break;
          case 'cat':
            if (args.length < 2) {
              term.writeln('\x1b[31mcat: 缺少操作数\x1b[0m');
            } else {
              term.writeln('\x1b[31mcat: ' + args[1] + ': 没有那个文件或目录\x1b[0m');
            }
            break;
          case 'ls':
            term.writeln('\x1b[1;34mDesktop\x1b[0m  \x1b[1;34mDocuments\x1b[0m  \x1b[1;34mDownloads\x1b[0m  \x1b[1;34mPictures\x1b[0m');
            term.writeln('\x1b[32mTerminalX.html\x1b[0m  \x1b[33mREADME.md\x1b[0m');
            break;
          case 'neofetch':
            term.writeln('');
            term.writeln('        \x1b[1;36m█████████\x1b[0m          \x1b[1;33muser\x1b[0m@\x1b[1;33mterminalx\x1b[0m');
            term.writeln('      \x1b[1;36m███\x1b[0m     \x1b[1;36m███\x1b[0m        \x1b[90m─────────────\x1b[0m');
            term.writeln('    \x1b[1;36m███\x1b[0m   \x1b[37m███\x1b[0m   \x1b[1;36m███\x1b[0m       \x1b[1;33mOS:\x1b[0m TerminalX 1.0');
            term.writeln('    \x1b[1;36m███\x1b[0m   \x1b[37m███\x1b[0m   \x1b[1;36m███\x1b[0m       \x1b[1;33mShell:\x1b[0m xterm.js');
            term.writeln('    \x1b[1;36m███\x1b[0m   \x1b[37m███\x1b[0m   \x1b[1;36m███\x1b[0m       \x1b[1;33mTerminal:\x1b[0m TerminalX');
            term.writeln('      \x1b[1;36m███\x1b[0m     \x1b[1;36m███\x1b[0m        \x1b[1;33mTheme:\x1b[0m Dark');
            term.writeln('        \x1b[1;36m█████████\x1b[0m          \x1b[1;33mFont:\x1b[0m Cascadia Code');
            term.writeln('');
            break;
          default:
            term.writeln('\x1b[31m' + bin + ': 未找到命令\x1b[0m');
            term.writeln('输入 \x1b[33mhelp\x1b[0m 查看可用命令');
        }
      }

      tabs.push(createDefaultTab());
      activeTabId = tabs[0].id;

      // ---------- 核心：智能伸缩控制 ----------
      function applyShrinkLogic() {
        const tabEls = Array.from(tabBar.querySelectorAll('.tab'));
        if (tabEls.length === 0) return;

        tabEls.forEach(el => el.classList.remove('shrinkable'));

        const barWidth = tabBar.scrollWidth;
        const clientWidth = tabBar.clientWidth;

        if (barWidth <= clientWidth) {
          return;
        }

        tabEls.forEach(el => {
          const id = parseInt(el.dataset.tabId);
          if (id !== activeTabId) {
            el.classList.add('shrinkable');
          }
        });
      }

      // ---------- 滚动辅助函数 ----------
      function scrollTabToView(tabId, behavior) {
        behavior = behavior || 'smooth';
        const tabEl = tabBar.querySelector('.tab[data-tab-id="' + tabId + '"]');
        if (!tabEl) return;

        const addBtn = tabBar.querySelector('.tab-add');
        const addBtnWidth = addBtn ? addBtn.offsetWidth + 8 : 40;

        const containerRect = tabBar.getBoundingClientRect();
        const tabRect = tabEl.getBoundingClientRect();

        const rightBoundary = containerRect.right - addBtnWidth;

        if (tabRect.left >= containerRect.left && tabRect.right <= rightBoundary) {
          return;
        }

        const scrollLeft = tabBar.scrollLeft + (tabRect.left - containerRect.left) - 20;
        tabBar.scrollTo({
          left: scrollLeft,
          behavior: behavior
        });
      }

      // ---------- 渲染标签 ----------
      function renderTabs() {
        const addBtn = tabBar.querySelector('.tab-add');
        Array.from(tabBar.children).forEach(function(child) {
          if (!child.classList.contains('tab-add')) child.remove();
        });

        tabs.forEach(function(tab) {
          const tabEl = document.createElement('div');
          tabEl.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
          tabEl.dataset.tabId = tab.id;

          const titleSpan = document.createElement('span');
          titleSpan.className = 'tab-title';
          titleSpan.textContent = tab.title || '终端';
          tabEl.appendChild(titleSpan);

          const closeBtn = document.createElement('button');
          closeBtn.className = 'close-btn';
          closeBtn.innerHTML = '✕';
          closeBtn.title = '关闭标签';
          if (tabs.length <= 1) {
            closeBtn.style.display = 'none';
          }
          closeBtn.addEventListener('mousedown', function(e) { e.stopPropagation(); });
          closeBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            closeTab(tab.id);
          });
          tabEl.appendChild(closeBtn);

          tabEl.addEventListener('click', function() {
            switchTab(tab.id);
          });

          tabBar.insertBefore(tabEl, addBtn);
        });

        tabCounter.textContent = '标签: ' + tabs.length;
        applyShrinkLogic();
        scrollTabToView(activeTabId, 'smooth');
      }

      // ---------- 切换标签 ----------
      function switchTab(tabId) {
        if (tabId === activeTabId) return;
        activeTabId = tabId;

        const allTabs = tabBar.querySelectorAll('.tab');
        allTabs.forEach(function(el) {
          const id = parseInt(el.dataset.tabId);
          el.classList.toggle('active', id === activeTabId);
        });

        const panes = wrapper.querySelectorAll('.terminal-pane');
        panes.forEach(function(pane) {
          const id = parseInt(pane.dataset.tabId);
          pane.classList.toggle('active', id === activeTabId);
        });

        applyShrinkLogic();
        scrollTabToView(activeTabId, 'smooth');

        var activeTab = tabs.find(function(t) { return t.id === activeTabId; });
        if (activeTab && activeTab.terminal) {
          setTimeout(function() {
            activeTab.terminal.focus();
            fitAddon.fit();
          }, 50);
        }
      }

      // ---------- 关闭标签 ----------
      function closeTab(tabId) {
        if (tabs.length <= 1) return;
        const index = tabs.findIndex(function(t) { return t.id === tabId; });
        if (index === -1) return;

        let newActiveId = activeTabId;
        if (tabId === activeTabId) {
          const nextIndex = Math.min(index + 1, tabs.length - 1);
          const prevIndex = Math.max(index - 1, 0);
          const targetIndex = (nextIndex < tabs.length && nextIndex !== index) ? nextIndex : prevIndex;
          newActiveId = tabs[targetIndex].id;
        }

        var closedTab = tabs.find(function(t) { return t.id === tabId; });
        if (closedTab) {
          if (closedTab.terminal) {
            closedTab.terminal.dispose();
          }
          if (closedTab.pane) {
            closedTab.pane.remove();
          }
        }

        tabs = tabs.filter(function(t) { return t.id !== tabId; });
        activeTabId = newActiveId;
        renderTabs();

        var newActive = tabs.find(function(t) { return t.id === activeTabId; });
        if (newActive && newActive.pane) {
          newActive.pane.classList.add('active');
        }

        setTimeout(function() {
          if (newActive && newActive.terminal) {
            newActive.terminal.focus();
            fitAddon.fit();
          }
        }, 50);
      }

      // ---------- 新建标签 ----------
      function createNewTab() {
        const newTab = {
          id: nextId++,
          title: '终端',
          terminal: null,
          pane: null
        };
        tabs.push(newTab);
        activeTabId = newTab.id;
        createTerminal(newTab);
        renderTabs();

        setTimeout(function() {
          if (newTab.terminal) {
            newTab.terminal.focus();
            fitAddon.fit();
          }
        }, 50);
      }

      // ---------- 键盘快捷键 ----------
      function handleKeyDown(e) {
        if (e.ctrlKey || e.metaKey) {
          if (e.key === 't') {
            e.preventDefault();
            createNewTab();
            return;
          }
          if (e.key === 'w') {
            e.preventDefault();
            if (tabs.length > 1) {
              closeTab(activeTabId);
            }
            return;
          }
        }
      }

      // ---------- 事件监听 ----------
      document.addEventListener('keydown', handleKeyDown);

      document.getElementById('addTabBtn').addEventListener('click', function(e) {
        e.stopPropagation();
        createNewTab();
      });

      document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

      // 窗口resize → 重新 fit 所有终端
      window.addEventListener('resize', function() {
        fitAddon.fit();
        applyShrinkLogic();
      });

      // 鼠标滚轮 → 横向滚动标签栏
      tabBar.addEventListener('wheel', function(e) {
        const delta = e.deltaY || e.deltaX;
        if (Math.abs(delta) < 1) return;
        e.preventDefault();
        tabBar.scrollLeft += delta;
      }, { passive: false });

      // 触控 → 横向滚动标签栏
      let touchStartX = 0;
      let touchStartScrollLeft = 0;
      tabBar.addEventListener('touchstart', function(e) {
        touchStartX = e.touches[0].clientX;
        touchStartScrollLeft = tabBar.scrollLeft;
      }, { passive: true });
      tabBar.addEventListener('touchmove', function(e) {
        const clientX = e.touches[0].clientX;
        const deltaX = touchStartX - clientX;
        tabBar.scrollLeft = touchStartScrollLeft + deltaX;
      }, { passive: true });

      // 实时时钟
      const clock = document.getElementById('clock');
      function updateClock() {
        const now = new Date();
        clock.textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
      }
      updateClock();
      setInterval(updateClock, 1000);

      // 启动：创建第一个终端
      var firstTab = tabs[0];
      createTerminal(firstTab);
      renderTabs();
      setTimeout(function() {
        firstTab.terminal.focus();
        fitAddon.fit();
      }, 100);
    })();
  </script>
</body>
</html>
